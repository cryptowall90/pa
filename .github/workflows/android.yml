name: Android CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      # Publishing the build as a release writes to the repository.
      contents: write
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: picture-perfect-x-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      # An artifact is the right record of a CI run and the wrong way to get a build onto a phone:
      # it is zipped, it needs a signed-in session, it expires, and GitHub's mobile views don't show
      # artifacts at all. A release asset is a plain .apk at a plain URL that a phone can just tap.
      #
      # Debug rather than release on purpose: the release build type has no signing config, so
      # assembleRelease produces an unsigned APK that Android refuses to install.
      - name: Publish the APK somewhere a phone can reach
        # Only the branches actually being tested — every branch would fight over the one tag.
        if: github.ref_name == 'main' || startsWith(github.ref_name, 'claude/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk picture-perfect-x-debug.apk
          # Recreated rather than reused, so the tag points at the commit that built this.
          gh release delete debug-latest --yes --cleanup-tag || true
          gh release create debug-latest picture-perfect-x-debug.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Latest debug build" \
            --notes "Debug build of ${GITHUB_SHA:0:7} on ${GITHUB_REF_NAME}. Installs alongside any other copy of the app."
